set -g mouse on                    # click panes, scroll, resize
set -g base-index 1                # number windows from 1, not 0
setw -g pane-base-index 1
set -g renumber-windows on         # no gaps when you close a window
set -sg escape-time 10             # stops Esc lag in nvim
set -g focus-events on             # needed for nvim autoread/checktime
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"   # true color

# pass modified keys (e.g. Shift-Enter in Claude Code) through to apps
set -s extended-keys on
set -as terminal-features '*:extkeys'

# new windows and splits open in the current directory
bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# copy to the macOS clipboard when you finish a mouse selection or press y
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# status bar: dark bar, light text, active window highlighted
set -g status-style "bg=colour235,fg=colour252"
setw -g window-status-current-style "bg=colour33,fg=colour255,bold"
setw -g window-status-style "fg=colour245"
set -g status-left-style "fg=colour114,bold"
